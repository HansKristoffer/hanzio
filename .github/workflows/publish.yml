# Publishes the checked-out commit to npm via trusted publishing (OIDC).
# Called by release.yml after a release is created; workflow_dispatch is the
# escape hatch for republishing by hand. No NPM_TOKEN is used.
name: Publish
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      # Trusted publishing needs npm >= 11.5.1; Node 22 bundles an older one.
      - run: npm install -g npm@latest
      # prepublishOnly runs `bun run build`.
      - run: npm publish --provenance --access public
